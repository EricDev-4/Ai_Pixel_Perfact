<!doctype html>
<!-- 드래그로 배치하고 가방 밖에 놓으면 버립니다. 드래그 중 R 또는 우클릭으로 회전합니다.
B 또는 가방 버튼으로 열고 닫습니다. 전투 중 열린 가방은 0.3배속이며, 드래그하지 않을 때 R은 재시작입니다.
CONFIG의 castleHP·restSeconds는 성 체력·휴식 초, waves는 차례로 적 수·체력 배율·등장 간격(초)입니다.
enemies는 체력·속력(도트/초)·공격·드랍률, items·combo는 피해·사거리(도트)·재사용 시간(초)·조합 효과입니다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bag Bastion · 가방 디펜스</title>
<style>
  * { box-sizing: border-box }
  html,body { margin:0; min-height:100%; background:#181425 }
  body { min-height:100vh; display:grid; place-items:center }
  canvas { display:block; image-rendering:pixelated; width:960px; height:540px; user-select:none; touch-action:none }
</style>
</head>
<body>
<canvas id="game" width="960" height="540" aria-label="가방 디펜스. 가방에 아이템을 드래그해 배치하고 5개 웨이브 동안 성을 지키세요."></canvas>
<script>
'use strict';
const CONFIG = {
  castleHP: 100, restSeconds: 15, bagSpeed: 0.3, reserveLimit: 4,
  cols: 4, rows: 3, cell: 16, gate: 146, spawn: 925, floor: 253,
  waves: [
    { count: 6, hp: 1, interval: 1.9 },
    { count: 8, hp: 1.22, interval: 1.65 },
    { count: 10, hp: 1.44, interval: 1.6, ogre: true },
    { count: 13, hp: 1.72, interval: 1.35 },
    { count: 15, hp: 2, interval: 1.25, ogre: true }
  ],
  enemies: {
    slime:  { hp: 18, speed: 46, damage: 3, period: 1.5, drop: 0.25, height: 14 },
    goblin: { hp: 26, speed: 69, damage: 4, period: 1.3, drop: 0.25, height: 24 },
    ogre:   { hp: 100, speed: 40, damage: 9, period: 2.0, drop: 1, height: 36 }
  },
  items: {
    fire:    { name:'불지팡이', shape:[[0,0],[0,1],[0,2]], color:9, cd:1.8, damage:13, range:800, effect:'파이어볼 명중 후 3초간 화상', short:'화상 투사체' },
    ice:     { name:'얼음 마법책', shape:[[0,0],[1,0],[0,1],[1,1]], color:18, cd:1.75, damage:10, range:800, effect:'냉기탄 명중 후 2초간 50% 감속', short:'감속 투사체' },
    hammer:  { name:'천둥 망치', shape:[[0,0],[1,0],[2,0],[1,1]], color:11, cd:1.9, damage:18, range:800, effect:'성에 가장 가까운 적에게 번개', short:'즉발 번개' },
    dagger:  { name:'단검', shape:[[0,0]], color:20, cd:0.46, damage:10, range:98, effect:'성 앞의 적을 빠르게 찌르기', short:'근거리 자동 공격' },
    shield:  { name:'방패', shape:[[0,0],[1,0]], color:4, reduction:0.2, effect:'성이 받는 피해 20% 감소', short:'성 피해 감소' },
    mana:    { name:'마나석', shape:[[0,0]], color:28, reduction:0.25, effect:'변이 닿은 무기의 쿨다운 25% 감소', short:'인접 무기 가속' }
  },
  combo: { burnDamage: 3, burnSeconds: 3, slowSeconds: 2, slowFactor: 0.5,
    steamDamage: 11, steamRadius: 70, chainCount: 3, chainRange: 155, counterDamage: 14, counterRadius: 100 }
};
const P = ['#be4a2f','#d77643','#ead4aa','#e4a672','#b86f50','#733e39','#3e2731','#a22633',
  '#e43b44','#f77622','#feae34','#fee761','#63c74d','#3e8948','#265c42','#193c3e',
  '#124e89','#0099db','#2ce8f5','#ffffff','#c0cbdc','#8b9bb4','#5a6988','#3a4466',
  '#262b44','#181425','#ff0044','#68386c','#b55088','#f6757a','#e8b796','#c28569'];
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', {alpha:false});
ctx.imageSmoothingEnabled = false;
function fit() {
  const zoom = Math.max(1, Math.floor(Math.min(innerWidth/960, innerHeight/540)));
  canvas.style.width = (960*zoom)+'px';
  canvas.style.height = (540*zoom)+'px';
}
fit(); window.addEventListener('resize', fit);
const I = CONFIG.items, C = CONFIG.combo, types = Object.keys(I);
const recipes = [
  { a:'fire', b:'hammer', name:'연쇄 화염', color:10 },
  { a:'fire', b:'ice', name:'증기 폭발', color:18 },
  { a:'hammer', b:'shield', name:'번개 반격', color:11 }
];
const bag = {x:57, y:385}, slots = {x:344, y:378, step:68, w:57, h:58};
const bagButton = {x:185,y:452,w:108,h:24};
let g, drag, uid = 0, pointer = {x:-1,y:-1}, links = [], active = new Set();
function item(type,x=0,y=0) { return {id:++uid,type,x,y,rotation:0,timer:0}; }
function cells(it, rotation=it.rotation) {
  let points = I[it.type].shape;
  for (let i=0; i<rotation; i++) {
    const h = Math.max(...points.map(p=>p[1]));
    points = points.map(([x,y])=>[h-y,x]);
  }
  return points;
}
function at(x,y,skip) {
  return g.bag.find(it=>it!==skip && cells(it).some(([dx,dy])=>it.x+dx===x && it.y+dy===y));
}
function fits(it,x,y,rot) {
  return cells(it,rot).every(([dx,dy])=>x+dx>=0 && y+dy>=0 && x+dx<CONFIG.cols && y+dy<CONFIG.rows && !at(x+dx,y+dy,it));
}
function connections() {
  links=[]; active=new Set();
  for (const it of g.bag) it.neighbors=new Set();
  for (const it of g.bag) for (const [dx,dy] of cells(it)) {
    const x=it.x+dx,y=it.y+dy;
    for (const [ox,oy] of [[1,0],[0,1]]) {
      const other=at(x+ox,y+oy);
      if (!other || other===it) continue;
      it.neighbors.add(other.type); other.neighbors.add(it.type);
      const r=recipes.find(r=>(r.a===it.type && r.b===other.type)||(r.b===it.type && r.a===other.type));
      if (r) active.add(r);
      if (r || ([it,other].some(i=>i.type==='mana') && [it,other].some(i=>I[i.type].cd)))
        links.push({x,y,ox,oy,first:it,second:other,color:r?r.color:28});
    }
  }
}
function reset() {
  drag=null;
  g={phase:'rest', wave:1, hp:CONFIG.castleHP, left:CONFIG.restSeconds, spawned:0, spawnIn:0, open:true,
    bag:[item('dagger',1,1)], reserve:Array(CONFIG.reserveLimit).fill(null), enemies:[], bolts:[], fx:[],
    shake:0, t:0, message:'', messageTime:0};
  connections();
}
function note(s) {g.message=s; g.messageTime=2.4}
function battle() {
  g.phase='battle'; g.left=0; g.spawned=0; g.spawnIn=0; g.open=!!drag;
}
function spawnEnemy() {
  const n=g.spawned, w=CONFIG.waves[g.wave-1];
  const type=(w.ogre && n===w.count-1)?'ogre':((n+g.wave)%3===0?'goblin':'slime');
  const spec=CONFIG.enemies[type], hp=Math.round(spec.hp*w.hp);
  g.enemies.push({id:++uid,type,spec,x:CONFIG.spawn,hp,max:hp,attack:0.55,burn:0,burnTick:0,
    slow:0,flash:0,step:n*1.13});
  g.spawned++;
}
function effect(kind,x,y,life,props={}) {g.fx.push({kind,x,y,life,total:life,...props})}
function drop(e) {
  if (Math.random()>=e.spec.drop) return;
  const index=g.reserve.indexOf(null);
  if (index<0) {note('대기칸 가득 참 · 새 드랍 소멸');return}
  const it=item(types[Math.floor(Math.random()*types.length)]);
  g.reserve[index]=it; note(I[it.type].name+' 획득');
  effect('drop',e.x,CONFIG.floor-e.spec.height,0.65,{type:it.type,slot:index});
}
function hit(e,damage,color=2) {
  if (e.hp<=0) return;
  e.hp=Math.max(0,e.hp-damage); e.flash=1;
  effect('number',e.x,CONFIG.floor-e.spec.height-4,0.68,{label:String(damage),color});
  if (!e.hp) {effect('death',e.x,CONFIG.floor,0.2,{enemy:e});drop(e); if(e.type==='ogre') g.shake=0.38}
}
function burn(e) {if(e.burn<=0) e.burnTick=1; e.burn=C.burnSeconds}
function arc(x,y,e,color) {
  effect('arc',x,y,0.19,{endX:e.x,endY:CONFIG.floor-e.spec.height/2,color,seed:Math.random()*100});
}
function fireWeapon(it,e) {
  const spec=I[it.type], sx=CONFIG.gate-23, sy=CONFIG.floor-47;
  if (it.type==='dagger') {
    effect('slash',e.x,CONFIG.floor-e.spec.height/2,0.15); hit(e,spec.damage); return;
  }
  if (it.type==='hammer') {
    const chain=it.neighbors.has('fire'), seen=new Set();
    let x=sx,y=sy,target=e;
    while (target) {
      seen.add(target); arc(x,y,target,chain?10:11); hit(target,spec.damage,11);
      if (!chain) break;
      burn(target); x=target.x; y=CONFIG.floor-target.spec.height/2;
      target=seen.size<C.chainCount?g.enemies.filter(n=>n.hp>0 && !seen.has(n) && Math.abs(n.x-x)<=C.chainRange)
        .sort((a,b)=>Math.abs(a.x-x)-Math.abs(b.x-x))[0]:null;
    }
    return;
  }
  g.bolts.push({x:sx,y:sy,target:e,type:it.type,damage:spec.damage,steam:it.type==='fire' && it.neighbors.has('ice')});
}
function advanceBolts(dt) {
  g.bolts=g.bolts.filter(b=>{
    const e=b.target;
    if (e.hp<=0) return false;
    const tx=e.x, ty=CONFIG.floor-e.spec.height/2, dx=tx-b.x, dy=ty-b.y;
    const dist=Math.hypot(dx,dy),step=400*dt;
    if (dist>step) {b.x+=step*dx/dist;b.y+=step*dy/dist;return true}
    hit(e,b.damage,b.type==='ice'?18:10);
    if(b.type==='ice') e.slow=C.slowSeconds;
    else {
      burn(e);
      if(b.steam) {
        effect('steam',tx,ty,0.46);
        for(const n of g.enemies) if(Math.abs(n.x-tx)<=C.steamRadius) hit(n,C.steamDamage,20);
      }
    }
    return false;
  });
}
function assault(e) {
  const shields=g.bag.filter(i=>i.type==='shield').length;
  const damage=e.spec.damage*Math.pow(1-I.shield.reduction,shields);
  g.hp=Math.max(0,Math.round((g.hp-damage)*1e6)/1e6);
  effect('number',105,CONFIG.floor-68,0.8,{label:'-'+Number(damage.toFixed(2)),color:29});
  if(active.has(recipes[2])) {
    for(const n of g.enemies) if(n.hp>0 && n.x<=CONFIG.gate+C.counterRadius) {
      arc(CONFIG.gate-12,CONFIG.floor-19,n,18);hit(n,C.counterDamage,18);
    }
  }
}
function finished() {return g.phase==='win' || g.phase==='loss'}
function update(realDt) {
  const dt=realDt*(g.phase==='battle' && g.open?CONFIG.bagSpeed:1);
  g.t+=dt; g.shake=Math.max(0,g.shake-dt); g.messageTime-=realDt;
  for(const f of g.fx) f.life-=dt;
  g.fx=g.fx.filter(f=>f.life>0);
  if(finished()) return;
  if(g.phase==='rest') {g.left-=dt;if(g.left<=0) battle();return}
  const wave=CONFIG.waves[g.wave-1];
  g.spawnIn-=dt;
  if(g.spawned<wave.count && g.spawnIn<=0) {spawnEnemy();g.spawnIn+=wave.interval}
  for(const it of g.bag) {
    const s=I[it.type]; if(!s.cd) continue;
    it.timer=Math.max(0,it.timer-dt/(it.neighbors.has('mana')?1-I.mana.reduction:1));
    if(it.timer>0) continue;
    const target=g.enemies.filter(e=>e.hp>0 && e.x<=CONFIG.gate+s.range).sort((a,b)=>a.x-b.x)[0];
    if(target) {fireWeapon(it,target);it.timer=s.cd}
  }
  advanceBolts(dt);
  for(const e of g.enemies) {
    if(e.hp<=0) continue;
    if(e.burn>0) {
      e.burnTick-=Math.min(dt,e.burn); e.burn=Math.max(0,e.burn-dt);
      if(e.burnTick<=1e-8) {hit(e,C.burnDamage,9);e.burnTick+=1}
    }
    if(e.hp<=0) continue;
    const speed=e.spec.speed*(e.slow>0?C.slowFactor:1);
    e.slow=Math.max(0,e.slow-dt); e.step+=dt*speed/6;
    if(e.x>CONFIG.gate) e.x=Math.max(CONFIG.gate,e.x-speed*dt);
    else {
      e.attack-=dt;
      if(e.attack<=0) {assault(e);e.attack+=e.spec.period;if(!g.hp) break}
    }
  }
  g.enemies=g.enemies.filter(e=>e.hp>0);
  if(!g.hp) {g.phase='loss';drag=null}
  else if(g.spawned===wave.count && !g.enemies.length) {
    g.bolts=[];
    if(g.wave===CONFIG.waves.length) {g.phase='win';drag=null}
    else {g.wave++;g.phase='rest';g.left=CONFIG.restSeconds;g.open=true}
  }
}
// All artwork is drawn on the logical pixel grid. Text masks also use a single palette ink.
let dc=ctx;
function box(x,y,w,h,c) {dc.fillStyle=P[c];dc.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function frame(x,y,w,h,c) {
  box(x,y,w,1,c);box(x,y+h-1,w,1,c);box(x,y,1,h,c);box(x+w-1,y,1,h,c);
}
function line(x,y,X,Y,c) {
  x=Math.round(x);y=Math.round(y);X=Math.round(X);Y=Math.round(Y);
  const dx=Math.abs(X-x),dy=-Math.abs(Y-y),sx=x<X?1:-1,sy=y<Y?1:-1;
  let err=dx+dy;
  for(;;) {
    box(x,y,1,1,c);if(x===X && y===Y) break;
    const e=err*2;
    if(e>=dy) {err+=dy;x+=sx}
    if(e<=dx) {err+=dx;y+=sy}
  }
}
function poly(pts,c) {
  const ys=pts.map(p=>p[1]);
  for(let y=Math.floor(Math.min(...ys));y<Math.ceil(Math.max(...ys));y++){
    const hits=[], scan=y+0.5;
    for(let i=0;i<pts.length;i++){
      const [ax,ay]=pts[i],[bx,by]=pts[(i+1)%pts.length];
      if((ay<=scan && by>scan)||(by<=scan && ay>scan)) hits.push(ax+(scan-ay)*(bx-ax)/(by-ay));
    }
    hits.sort((a,b)=>a-b);
    for(let j=0;j+1<hits.length;j+=2) box(Math.ceil(hits[j]),y,Math.ceil(hits[j+1])-Math.ceil(hits[j]),1,c);
  }
}
function surface(w,h) {const s=document.createElement('canvas');s.width=w;s.height=h;return s}
const labels=new Map();
function label(str,x,y,size=11,color=20,bold=false,align='left') {
  str=String(str);
  const key=[str,size,color,bold].join('|');
  let s=labels.get(key);
  if(!s) {
    const font=(bold?'700 ':'500 ')+size+'px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
    s=surface(1,size+5);
    const c=s.getContext('2d',{willReadFrequently:true});c.font=font;
    s.width=Math.max(1,Math.ceil(c.measureText(str).width)+1);
    c.font=font;c.textBaseline='middle';c.fillStyle=P[color];c.fillText(str,0,s.height/2);
    const im=c.getImageData(0,0,s.width,s.height),rgb=parseInt(P[color].slice(1),16);
    for(let j=0;j<im.data.length;j+=4){
      im.data[j]=rgb>>16;im.data[j+1]=(rgb>>8)&255;im.data[j+2]=rgb&255;im.data[j+3]=im.data[j+3]>=75?255:0;
    }
    c.putImageData(im,0,0);
    if(labels.size>1400) labels.clear();labels.set(key,s);
  }
  dc.drawImage(s,Math.round(x-(align==='right'?s.width:align==='center'?s.width/2:0)),Math.round(y-s.height/2));
}
const glyph={
 A:'01110/11011/11011/11111/11011/11011/11011',B:'11110/11011/11011/11110/11011/11011/11110',
 G:'01111/11000/11000/11011/11001/11011/01111',S:'01111/11000/11000/01110/00011/00011/11110',
 T:'11111/00100/00100/00100/00100/00100/00100',I:'111/010/010/010/010/010/111',
 O:'01110/11011/11011/11011/11011/11011/01110',N:'11001/11001/11101/11111/11011/11001/11001'
};
function brand(x,y,color) {
  for(const ch of 'BAG BASTION') {
    if(ch===' '){x+=6;continue}
    const rows=glyph[ch].split('/');
    rows.forEach((row,j)=>[...row].forEach((v,i)=>{if(v==='1') box(x+i*2,y+j*2,2,2,color)}));
    x+=(rows[0].length+1)*2;
  }
}
function stamp(rows,x,y,scale,inks) {
  rows.forEach((row,j)=>[...row].forEach((v,i)=>{if(v!=='.')box(x+i*scale,y+j*scale,scale,scale,inks[v])}));
}
const icons={
 dagger:['..........aa','.........aba','........abba','.......abba.','......abba..','.....abba...','..c.abba....','..ccaba.....','...ccc......','..dd.cc.....','.dd...c.....','cc..........'],
 fire:['.....b......','....bba.....','...babaa....','...abcca....','....aaa.....','....ddd.....','.....da.....','....dd......','....da......','...dd.......','...da.......','...d........'],
 ice:['............','..cccaaac...','.cbbcacbac..','.cbbcacbac..','.cbacacbac..','.cbbcaabac..','.cbbcacbac..','.cbbcacbac..','.cbbcacbac..','.ccccacccc..','..dddcddd...','............'],
 hammer:['.........bb.','.....aa.abba','....abbaabba','...abccaabba','...abcaabba.','...aabbadd..','....aabdd...','.....add....','....add.....','...add......','..add.......','..dd........'],
 shield:['..dddddddd..','..dbbaaaad..','..dbbaacad..','..dbbaccad..','..dbbaaaad..','..dbbaaaad..','...dbaaad...','...dbaaad...','....daad....','.....dd.....','............','............'],
 mana:['.....bb.....','....bcab....','...bccabb...','..bccaaabb..','..bccaaabb..','..bcaaaadb..','...baaddb...','...baaddb...','....badb....','.....db.....','............','............'],
 pack:['....aaaa....','...ab..ba...','..aaaaaaab..','.acccccccab.','.acdddddcab.','aacdaddadabb','abcdaddadcab','abcccaacccab','abddddddddab','abdaaaaaddab','.abbbbbbbab.','..aaaaaaaa..'],
 heart:['.aa.aa.','aaaaaaa','abaaaaa','.aaaaa.','..aaa..','...a...'],
 crate:['.aaaaaaa.','abbbbbbbc','accccccbc','abcbbcbcc','abcbcbccc','abbbcbcbc','abbbbbbbc','.ccccccc.']
};
const inks={
 dagger:{a:21,b:19,c:10,d:4},fire:{a:9,b:11,c:10,d:4},ice:{a:18,b:16,c:21,d:23},
 hammer:{a:22,b:20,c:11,d:4},shield:{a:4,b:3,c:10,d:2},mana:{a:28,b:27,c:29,d:6},
 pack:{a:5,b:4,c:10,d:3},heart:{a:8,b:29},crate:{a:2,b:4,c:5}
};
function icon(type,x,y,scale=1) {stamp(icons[type],x,y,scale,inks[type])}
function randomStream(seed) {
  return ()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
}
function pine(x,base,h,c,light) {
  const top=base-h, half=Math.floor(h*0.25);
  box(x-1,top+4,3,h-3,c);
  for(let i=0;i<4;i++){
    const a=top+Math.floor(i*h*0.16), b=top+Math.floor((0.37+i*0.18)*h),w=Math.max(2,Math.floor(half*(0.4+i*0.22)));
    poly([[x,a],[x+w,b-2],[x+w-3,b-2],[x+w-2,b],[x-2,b-2],[x-w,b+1]],c);
    if(light!==c) poly([[x,a+2],[x-1,b-6],[x-w+2,b-1]],light);
  }
}
function castle() {
  const rng=randomStream(215);
  function masonry(x,y,w,h,front,shade) {
    box(x,y,w,h,23);box(x+2,y+1,w-4,h-1,front);box(x+w-7,y+1,5,h-1,shade);
    for(let j=3;j<h-2;j+=5){
      for(let i=2+(j%2)*4;i<w-8;i+=9){
        if(rng()<0.65) {box(x+i,y+j,5,1,shade);box(x+i+4,y+j-2,1,2,shade)}
        if(rng()<0.32) box(x+i,y+j+1,3,1,20);
      }
    }
  }
  function roof(x,y,w,h) {
    const top=x+Math.floor(w/2);
    poly([[top,y],[x+w,y+h],[x,y+h]],6);

  if(e.button===2){e.preventDefault();rotate();return}
  if(e.button!==0 || drag)return;
  if(inside(pointer,bagButton.x,bagButton.y,bagButton.w,bagButton.h)){toggleBag();return}
  if(inGrid(pointer) && !g.open){toggleBag();return}
  const it=under(pointer); if(!it)return;
  g.open=true;
  const cell=gridPoint(pointer),grab=inGrid(pointer)?[cell.x-it.x,cell.y-it.y]:cells(it)[0];
  drag={it,rot:it.rotation,grabX:grab[0],grabY:grab[1],start:{...pointer}};
  e.preventDefault();
});
window.addEventListener('mousemove',e=>{movePointer(e);canvas.style.cursor=drag?'grabbing':under(pointer)?'grab':inside(pointer,bagButton.x,bagButton.y,bagButton.w,bagButton.h)?'pointer':'default'});
function release(e){
  if(!drag || e.button!==0)return;
  movePointer(e);
  const {it,rot}=drag,idx=g.reserve.indexOf(it);
  if(inGrid(pointer)){
    const {x,y}=candidate();
    if(fits(it,x,y,rot)){
      if(idx>=0){g.reserve[idx]=null;g.bag.push(it)}
      it.x=x;it.y=y;it.rotation=rot;
    } else note('배치 불가 · 원래 위치로 복귀');
  }else if(idx<0 || pointer.x!==drag.start.x || pointer.y!==drag.start.y){
    if(idx>=0)g.reserve[idx]=null;
    else g.bag=g.bag.filter(b=>b!==it);
    note(I[it.type].name+' 버림');
  }
  drag=null;connections();canvas.style.cursor='default';
}
window.addEventListener('mouseup',release);
window.addEventListener('blur',()=>{drag=null;pointer={x:-1,y:-1}});
canvas.addEventListener('mouseleave',()=>{if(!drag)pointer={x:-1,y:-1}});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  if(e.repeat || e.ctrlKey || e.metaKey || e.altKey)return;
  if(e.code==='KeyR'){e.preventDefault();if(drag)rotate();else reset()}
  if(e.code==='KeyB'){e.preventDefault();toggleBag()}
  if(e.code==='Escape' && drag)drag=null;
});
function footer(){
  box(0,502,960,38,24);box(0,502,960,1,23);
  let x=18;
  for(const [key,desc,width] of [['LMB','드래그 배치',34],['R / RMB','회전',53],['B','가방',18],['R','재시작',18]]){
    box(x,513,width,16,25);frame(x,513,width,16,22);label(key,x+width/2,521,9,2,true,'center');
    label(desc,x+width+7,521,11,20);x+=width+desc.length*11+24;
  }
  label('가방 밖에 놓기 · 버리기',940,521,11,21,false,'right');
}
function tooltip(title,body,extra,color){
  const w=260,h=extra?65:49,x=Math.min(951-w,Math.max(8,pointer.x+11)),y=pointer.y>=h+12?pointer.y-h-8:pointer.y+13;
  box(x+2,y+2,w,h,25);box(x,y,w,h,24);frame(x,y,w,h,22);box(x,y,3,h,color);
  label(title,x+11,y+13,13,color,true);label(body,x+11,y+34,11,20);
  if(extra)label(extra,x+11,y+53,10,21);
}
function overlay(){
  for(const f of g.fx)if(f.kind==='drop'){
    const t=1-f.life/f.total,x=slots.x+f.slot*slots.step+22,y=slots.y+22;
    icon(f.type,f.x+(x-f.x)*t,f.y+(y-f.y)*t-70*Math.sin(Math.PI*t));
  }
  if(finished())return;
  if(drag){
    if(inGrid(pointer)){
      const {x,y}=candidate(),ok=fits(drag.it,x,y,drag.rot);
      itemTile(drag.it,bag.x+x*16,bag.y+y*16,drag.rot,ok?12:8);
      label(ok?'배치 가능':'배치 불가',90,459,10,ok?12:29,true,'center');
    }else{
      itemTile(drag.it,pointer.x-8-drag.grabX*16,pointer.y-8-drag.grabY*16,drag.rot,8);
      const X=Math.min(905,Math.max(4,pointer.x+13)),Y=Math.min(520,pointer.y+12);
      box(X,Y,50,17,25);frame(X,Y,50,17,8);label('놓아 버림',X+25,Y+8,9,29,true,'center');
    }
    return;
  }
  const it=hoveredItem(pointer);
  if(it){
    const s=I[it.type],matches=recipes.filter(r=>r.a===it.type || r.b===it.type).map(r=>I[r.a===it.type?r.b:r.a].name);
    if(s.cd)matches.push('마나석 (가속)');
    const combo=matches.length?matches.join(' · '):'모든 공격 아이템 (가속)';
    tooltip(s.name,s.effect,'조합 상대  '+combo,s.color);return;
  }
  const hints=['번개가 최대 세 적을 잇고 각각 화상을 입힙니다.','파이어볼 명중 시 주변 적에게 증기 피해를 줍니다.','성이 피격되면 성 앞의 적에게 번개가 떨어집니다.'];
  recipes.forEach((r,i)=>{if(inside(pointer,648,355+i*42,281,34))tooltip(r.name,hints[i],I[r.a].name+' + '+I[r.b].name,r.color)});
}
function draw(){
  box(0,0,960,540,25);header();world();bagPanel();reservePanel();comboPanel();footer();overlay();
}
paintScenery();reset();draw();
const STEP=1/60;
let last=null,carry=0;
function loop(now){
  if(last!==null)carry+=Math.min(0.2,(now-last)/1000);
  last=now;
  while(carry>=STEP){update(STEP);carry-=STEP}
  draw();requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange',()=>{last=null;carry=0});
requestAnimationFrame(loop);
</script>
</body>
</html>
